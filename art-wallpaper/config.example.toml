# art-wallpaper config
# Copied to ~/.art-wallpaper/config.toml on first run — edit that copy.
# Taste tuning: raise/lower `weight` per collection (0 disables it).

[display]
width = 2560        # set to your screen's pixel size (Retina: use the point size x2 or just the native res)
height = 1600
mode = "auto"       # fill = edge-to-edge crop | matte = museum matte + shadow | auto = pick per artwork
matte = "auto"      # "auto" derives a muted tone from the artwork, or fix one e.g. "#1b1b1d"
caption = true      # small "Title · Artist · Date — Museum" in the corner

[behavior]
save_dir = "~/Pictures/ArtWallpapers"
history = 90        # no repeats within this many picks
min_width = 1400    # skip low-res source images
pool_ttl_days = 7   # how often to re-query the museum APIs
keep_files = 30     # old wallpapers kept on disk

# ───────────────────────── 莫奈 / Impressionism ─────────────────────────
# AIC holds the world's largest group of Monet's Stacks of Wheat + Water Lilies.

[[collection]]
name = "Monet 莫奈 — Art Institute of Chicago"
source = "aic"
query = "Claude Monet"
weight = 3

[[collection]]
name = "Monet 莫奈 — The Met"
source = "met"
query = "Claude Monet"
artist_only = true
weight = 2

[[collection]]
name = "Impressionists — Cleveland"
source = "cma"
query = "monet pissarro sisley"
weight = 1

# ───────────────────────── 中国画 / Chinese painting ─────────────────────────
# The Met's Asian Art department (id 6) has one of the best Song–Qing
# painting collections outside Asia, all public domain with full-res scans.

[[collection]]
name = "Chinese paintings 中国画 — The Met"
source = "met"
query = "China"
department = 6
medium = "Paintings"
weight = 3

[[collection]]
name = "Chinese art — Cleveland"
source = "cma"
query = "landscape"
department = "Chinese Art"
type = "Painting"
weight = 2

# ───────────────────────── 传世名作 / Curated classics ─────────────────────────
# Pieces the US museum APIs don't hold (北京故宫 / 台北故宫 / Marmottan / MoMA…),
# pulled from Wikimedia Commons. All public domain. Handscrolls (手卷) get a
# different section cropped每天 — a slow walk through the scroll over weeks.

[[collection]]
name = "Curated classics 传世名作"
source = "wikimedia"
weight = 3
files = [
  # — Monet essentials not in AIC/Met —
  { file = "Claude Monet, Impression, soleil levant.jpg", title = "印象·日出 Impression, Sunrise", artist = "Claude Monet 莫奈", date = "1872", source = "Musée Marmottan Monet" },
  { file = "Claude Monet - Woman with a Parasol - Madame Monet and Her Son - Google Art Project.jpg", title = "撑阳伞的女人 Woman with a Parasol", artist = "Claude Monet 莫奈", date = "1875", source = "National Gallery of Art" },

  # — 中国山水 —
  { file = "Wang Ximeng. A Thousand Li of Rivers and Mountains. (Complete, 51,3x1191,5 cm). 1113. Palace museum, Beijing.jpg", title = "千里江山图", artist = "王希孟 Wang Ximeng", date = "1113 · 北宋", source = "故宫博物院 Palace Museum, Beijing" },
  { file = "北宋 郭熙 樹色平遠圖 卷 -Old Trees, Level Distance MET DP167812.jpg", title = "树色平远图 Old Trees, Level Distance", artist = "郭熙 Guo Xi", date = "c. 1080 · 北宋", source = "The Met" },
  { file = "Guo Xi - Early Spring (large).jpg", title = "早春图 Early Spring", artist = "郭熙 Guo Xi", date = "1072 · 北宋", source = "台北故宫 National Palace Museum" },
  { file = "Fan Kuan - Travelers Among Mountains and Streams - Google Art Project.jpg", title = "溪山行旅图 Travelers Among Mountains and Streams", artist = "范宽 Fan Kuan", date = "c. 1000 · 北宋", source = "台北故宫 National Palace Museum" },
  { file = "Dwelling in the Fuchun Mountains (second half).jpg", title = "富春山居图·无用师卷", artist = "黄公望 Huang Gongwang", date = "1350 · 元", source = "台北故宫 National Palace Museum" },
  { file = "Huang Gongwang. Dwelling in the Fuchun Mountains. detail. National Palace Museum, Taipei.jpg", title = "富春山居图 (局部) Dwelling in the Fuchun Mountains", artist = "黄公望 Huang Gongwang", date = "1350 · 元", source = "台北故宫 National Palace Museum" },

  # — a few others —
  { file = "Van Gogh - Starry Night - Google Art Project.jpg", title = "星夜 The Starry Night", artist = "Vincent van Gogh 梵高", date = "1889", source = "MoMA" },
  { file = "Wheat Field with Cypresses MET DT1567.jpg", title = "麦田与柏树 Wheat Field with Cypresses", artist = "Vincent van Gogh 梵高", date = "1889", source = "The Met" },
  { file = "Tsunami by hokusai 19th century.jpg", title = "神奈川冲浪里 The Great Wave off Kanagawa", artist = "葛饰北斋 Hokusai", date = "c. 1831", source = "浮世绘 Ukiyo-e" },
  { file = "Caspar David Friedrich - Wanderer above the sea of fog.jpg", title = "雾海上的旅人 Wanderer above the Sea of Fog", artist = "Caspar David Friedrich", date = "1818", source = "Hamburger Kunsthalle" },
]

